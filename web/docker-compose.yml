# Web services for Pi (web search + page fetch). Started automatically by pidev.
# No port is exposed on the Mac: reachable only via the fixed IPs in the pidev-web network.
name: pidev-web

services:
  searxng:
    image: searxng/searxng:2026.11.6-ac11e14c5
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in pidev/.env}
    volumes:
      - ./searxng:/etc/searxng
    networks:
      web:
        ipv4_address: 172.31.250.10

  fetch:
    build: ./fetch
    image: pidev-fetch:local
    restart: unless-stopped
    networks:
      web:
        ipv4_address: 172.31.250.11

networks:
  web:
    name: pidev-web
    ipam:
      config:
        - subnet: 172.31.250.0/24
