[openshell]
version = 2

[openshell.gateway]

# Reference copy. Active file: ~/.config/openshell/gateway.toml
# Bind mounts for pidev/pinew (project folder from the Mac into the sandbox)
[openshell.drivers.docker]
allow_driver_config = true
enable_bind_mounts = true

[openshell.drivers.docker.resource_admission]
enabled = false
